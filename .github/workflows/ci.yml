name: CI Build & Test Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  frontend-validation:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_API_URL: https://trafficvision-ai-backend.onrender.com

  backend-validation:
    name: Backend Lint & Import Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Module Imports & Simulator
        run: |
          python -c "import app.main, simulator; print('Backend modules and simulator imported successfully!')"
