name: trafficvision-ai

services:
  db:
    image: postgres:16-alpine
    container_name: trafficvision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trafficvision_db
      POSTGRES_USER: trafficvision
      POSTGRES_PASSWORD: trafficvision_password
    ports:
      - "5432:5432"
    volumes:
      - trafficvision_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficvision -d trafficvision_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trafficvision-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://trafficvision:trafficvision_password@db:5432/trafficvision_db
      SECRET_KEY: change-this-secret-key-before-final-submission
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trafficvision-simulator
    restart: unless-stopped
    command: ["python", "simulator.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://trafficvision:trafficvision_password@db:5432/trafficvision_db
      SECRET_KEY: change-this-secret-key-before-final-submission
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      SIMULATOR_INTERVAL_SECONDS: 5
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: trafficvision-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  trafficvision_pgdata:
