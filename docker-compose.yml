services:

  db:
    image: postgres:16
    container_name: trafficvision-db
    environment:
      POSTGRES_DB: trafficvision_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: trafficvision-backend
    environment:
      APP_NAME: TrafficVision AI
      APP_VERSION: 1.0.0
      API_PREFIX: /api/v1
      DEBUG: "False"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/trafficvision_ai
      SECRET_KEY: change-this-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OPENROUTESERVICE_API_KEY: NEW_KEY_HERE
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: trafficvision-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data: