<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Neural Traffic Grid Lines -->
  <path d="M16 48 L32 20 L48 48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65"/>
  <line x1="24" y1="34" x2="40" y2="34" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M32 14 L32 50" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 3" opacity="0.75"/>

  <!-- Tri-Color Intelligent Nodes -->
  <!-- Top Node: Cyan/Blue AI Core -->
  <circle cx="32" cy="18" r="5.5" fill="url(#roseGlow)" filter="url(#glow)"/>
  <circle cx="32" cy="18" r="2.5" fill="#ffffff"/>

  <!-- Middle Nodes: Amber Transit Hub -->
  <circle cx="32" cy="34" r="5" fill="url(#amberGlow)" filter="url(#glow)"/>
  <circle cx="32" cy="34" r="2" fill="#ffffff"/>

  <!-- Bottom Left Node: Emerald Flow -->
  <circle cx="16" cy="48" r="5" fill="url(#emeraldGlow)" filter="url(#glow)"/>
  <circle cx="16" cy="48" r="2" fill="#ffffff"/>

  <!-- Bottom Right Node: Cyan Speed Stream -->
  <circle cx="48" cy="48" r="5" fill="url(#cyanGlow)" filter="url(#glow)"/>
  <circle cx="48" cy="48" r="2" fill="#ffffff"/>
</svg>