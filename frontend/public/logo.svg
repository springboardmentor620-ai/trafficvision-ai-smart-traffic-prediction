<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="nodeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="nodeEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="nodeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="nodeRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#logoBgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M12 36 L24 14 L36 36" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65"/>
    <line x1="17" y1="26" x2="31" y2="26" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <line x1="24" y1="12" x2="24" y2="38" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="2 2" opacity="0.7"/>

    <circle cx="24" cy="14" r="4.5" fill="url(#nodeRose)" filter="url(#logoGlow)"/>
    <circle cx="24" cy="14" r="2" fill="#ffffff"/>

    <circle cx="24" cy="26" r="4" fill="url(#nodeAmber)" filter="url(#logoGlow)"/>
    <circle cx="24" cy="26" r="1.8" fill="#ffffff"/>

    <circle cx="12" cy="36" r="4" fill="url(#nodeEmerald)" filter="url(#logoGlow)"/>
    <circle cx="12" cy="36" r="1.8" fill="#ffffff"/>

    <circle cx="36" cy="36" r="4" fill="url(#nodeCyan)" filter="url(#logoGlow)"/>
    <circle cx="36" cy="36" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <text x="64" y="32" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="url(#textGrad)" letter-spacing="-0.5">TrafficVision</text>
  <rect x="188" y="16" width="34" height="20" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="194" y="30" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="0.5">AI</text>
  <text x="64" y="47" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1.2">SMART MOBILITY PLATFORM</text>
</svg>
